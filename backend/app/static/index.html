<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Management MVP</title>
    <style>
      :root {
        --accent-yellow: #ecad0a;
        --primary-blue: #209dd7;
        --secondary-purple: #753991;
        --navy-dark: #032147;
        --gray-text: #888888;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        color: var(--navy-dark);
        background: #f7f8fb;
      }

      main {
        max-width: 720px;
        margin: 64px auto;
        padding: 32px;
        background: #fff;
        border: 1px solid rgba(3, 33, 71, 0.08);
        border-radius: 20px;
        box-shadow: 0 14px 32px rgba(3, 33, 71, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 16px;
        color: var(--gray-text);
      }

      pre {
        margin: 0;
        padding: 16px;
        border-radius: 12px;
        background: #f3f6fb;
        border: 1px solid rgba(3, 33, 71, 0.08);
      }

      .pill {
        display: inline-block;
        margin-top: 16px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--secondary-purple);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from the Project Management MVP</h1>
      <p>This is the Part 2 scaffolding page served by FastAPI.</p>
      <pre id="api-output">Calling /api/hello ...</pre>
      <span class="pill">Single-container setup</span>
    </main>
    <script>
      const output = document.getElementById("api-output");
      fetch("/api/hello")
        .then((response) => response.json())
        .then((data) => {
          output.textContent = JSON.stringify(data, null, 2);
        })
        .catch((error) => {
          output.textContent = JSON.stringify(
            { error: String(error) },
            null,
            2
          );
        });
    </script>
  </body>
</html>
